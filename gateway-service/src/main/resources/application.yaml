server:
  port: 8081

spring:
  application:
    name: gateway-service

  # Connects the Gateway to your local Docker Redis
  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      routes:
        - id: inventory-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/inventory/**
          filters:
            # THE RATE LIMITER: Allows 1 request per second, immediately rejecting spam
            - name: RequestRateLimiter
              args:
                redis-rate-limiter.replenishRate: 1
                redis-rate-limiter.burstCapacity: 1
                key-resolver: "#{@userKeyResolver}"

        - id: order-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/orders/**

  threads:
    virtual:
      enabled: true

