server:
  port: 8081

spring:
  application:
    name: gateway-service

  data:
    redis:
      host: localhost
      port: 6379

  threads:
    virtual:
      enabled: true

  docker:
    compose:
      enabled: false

jwt:
  secret: "${JWT_SECRET:this_is_a_dummy_key_for_local_development_purpose_only}"

sentry:
  dsn: ${SENTRY_DSN:}
  send-default-pii: true
  # Enable sending logs to Sentry
  logs:
    enabled: true
#  traces-sample-rate: 1.0

